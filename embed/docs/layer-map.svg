<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="870" aria-labelledby="title desc" role="img" viewBox="0 0 1062 870"><title id="title">E2B Embed layer map</title><desc id="desc">Four bands, top to bottom: source files in the repo, the Dockerfiles that copy them, the thirteen images (three built here, ten pulled), and the twenty compose services with the depends_on gates drawn (the seed → base-template, preflight → api-secrets and dashboard → ready gates are omitted for space). The stripe on each service names its image.</desc><style>svg{--bg:#F7F8FA;--surface:#FFFFFF;--ink:#151A21;--mid:#5B6470;--rule:#C9CED6;--accent:#D9521B;--c-node:#2F6FBF;--c-seed:#2F8F5B;color:var(--ink);font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#12161C;--surface:#1A2029;--ink:#E6E9EE;--mid:#98A2AE;--rule:#2C3541;--accent:#F27A45;--c-node:#6FA3E8;--c-seed:#4CBF7E}}.canvas{fill:var(--bg)}.band{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;fill:var(--mid)}.node,.sep{stroke-width:1}.sep{stroke:var(--rule);stroke-dasharray:3 5}.node{fill:var(--surface);stroke:currentColor}.node-ext{stroke-dasharray:4 3}.node-accent{stroke:var(--accent);stroke-width:1.75}.name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9.5px;font-weight:500;fill:currentColor}.name-lg{font-size:11px}.name-sm{font-size:9px}.sub{font-size:8.5px;font-weight:500;fill:var(--mid)}.sub-xs{font-size:8px}.edge{stroke:currentColor;stroke-width:1.1;fill:none}.arrow{fill:currentColor}.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8.5px;fill:var(--mid)}.bake{fill:none;stroke:var(--mid);stroke-dasharray:4 4;stroke-width:1}.note{font-family:Georgia,&quot;Times New Roman&quot;,serif;font-style:italic;font-size:9px;fill:var(--mid)}.st-tools{fill:var(--accent)}.st-node{fill:var(--c-node)}.st-seed{fill:var(--c-seed)}.st-e2b{fill:currentColor}.legend,.st-hub{fill:var(--mid)}.legend{font-size:9px;font-weight:500}</style><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect width="1062" height="870" x="0" y="0" class="canvas"/><text x="16" y="22" class="band">1 · Source files in the repo</text><rect width="106" height="44" x="20" y="44" class="node"/><text x="73" y="62" class="name" text-anchor="middle">preflight.sh</text><text x="73" y="78" class="sub" text-anchor="middle">scripts/</text><rect width="106" height="44" x="136" y="44" class="node"/><text x="189" y="62" class="name" text-anchor="middle">host-setup.sh</text><text x="189" y="78" class="sub" text-anchor="middle">scripts/</text><rect width="106" height="44" x="252" y="44" class="node"/><text x="305" y="62" class="name" text-anchor="middle">fetch-artifacts.sh</text><text x="305" y="78" class="sub" text-anchor="middle">scripts/</text><rect width="106" height="44" x="368" y="44" class="node"/><text x="421" y="58" class="name" text-anchor="middle">orchestrator-</text><text x="421" y="70" class="name" text-anchor="middle">launch.sh</text><text x="421" y="82" class="sub sub-xs" text-anchor="middle">scripts/</text><rect width="106" height="44" x="484" y="44" class="node"/><text x="537" y="62" class="name" text-anchor="middle">host-teardown.sh</text><text x="537" y="78" class="sub" text-anchor="middle">scripts/</text><rect width="106" height="44" x="600" y="44" class="node"/><text x="653" y="58" class="name" text-anchor="middle">build-base-</text><text x="653" y="70" class="name" text-anchor="middle">template.mjs</text><text x="653" y="82" class="sub sub-xs" text-anchor="middle">scripts/node/</text><rect width="106" height="44" x="716" y="44" class="node"/><text x="769" y="58" class="name" text-anchor="middle">smoke.mjs</text><text x="769" y="70" class="name" text-anchor="middle">package.json</text><text x="769" y="82" class="sub sub-