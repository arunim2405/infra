<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1200 924"><title id="title">E2B Embed: the running stack on one machine</title><desc id="desc">An SDK client on the left reaches three ports on the machine, the api on 3000, the dashboard on 3001 and client-proxy on 3002, while the other ten host ports belong behind the firewall. Inside the machine, api, client-proxy, the dashboard with its dashboard-api and the orchestrator run on the host network above three Firecracker sandboxes and four stores bound to loopback, with a strip of one-shot steps along the bottom that runs once before any of it is usable.</desc><style>@media (prefers-color-scheme:dark){[fill=&quot;#F7F8FA&quot;]{fill:#12161c}[fill=&quot;#FFFFFF&quot;]{fill:#1a2029}[fill=&quot;#151A21&quot;]{fill:#e6e9ee}[fill=&quot;#5B6470&quot;]{fill:#98a2ae}[fill=&quot;#FDF1EA&quot;]{fill:#2b211c}[fill=&quot;#2F8F5B&quot;]{fill:#4cbf7e}[stroke=&quot;#C9CED6&quot;],[stroke=&quot;#E3E6EB&quot;]{stroke:#2c3541}[stroke=&quot;#5B6470&quot;]{stroke:#98a2ae}[stroke=&quot;#D9521B&quot;]{stroke:#f27a45}[stroke=&quot;#2F8F5B&quot;]{stroke:#4cbf7e}[stroke=&quot;#2F6FBF&quot;]{stroke:#6fa3e8}}</style><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#5B6470" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrg" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2F8F5B" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1200" height="924" x="0" y="0" fill="#F7F8FA"/><text x="16" y="38" fill="#151A21" font-size="20" font-weight="600">E2B Embed — what runs, and how a client reaches it</text><text x="16" y="60" fill="#5B6470" font-size="13">The same stack whichever way you install it: real Firecracker sandboxes, and every store on the machine&apos;s own loopback.</text><line x1="14" x2="1186" y1="76" y2="76" stroke="#C9CED6" stroke-dasharray="3 5" stroke-width="1"/><rect width="236" height="86" x="14" y="96" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="30" y="124" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">SDK client</text><text x="30" y="144" fill="#5B6470" font-size="11.5">your code, off the machine</text><text x="30" y="162" fill="#5B6470" font-size="11.5">three SDK variables, one browser URL</text><path fill="none" stroke="#2F8F5B" stroke-width="1.1" marker-end="url(#arrg)" d="M28,182 V342 H44"/><path fill="none" stroke="#2F8F5B" stroke-width="1.1" marker-end="url(#arrg)" d="M28,218 H44"/><path fill="none" stroke="#2F8F5B" stroke-width="1.1" marker-end="url(#arrg)" d="M28,284 H44"/><rect width="206" height="44" x="44" y="196" fill="#FFF" stroke="#2F8F5B" stroke-width="1.75" rx="3"/><text x="58" y="216" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">E2B_API_URL</text><text x="58" y="232" fill="#5B6470" font-size="10">the REST API the SDK calls</text><rect width="206" height="44" x="44" y="262" fill="#FFF" stroke="#2F8F5B" stroke-width="1.75" rx="3"/><text x="58" y="282" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">E2B_SANDBOX_URL</text><text x="58" y="298" fill="#5B6470" font-size="10">sandbox traffic, header routed</text><rect width="206" height="56" x="44" y="320" fill="#FFF" stroke="#2F8F5B" stroke-width="1.75" rx="3"/><text x="58" y="340" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">E2B_API_KEY</text><text x="58" y="356" fill="#5B6470" font-size="10">generated on the first start ·</text><text x="58" y="369" fill="#5B6470" font-size="10">the dashboard&apos;s sign-in</text><line x1="250" x2="300" y1="218" y2="206" stroke="#2F8F5B" stroke-width="1.4" marker-end="url(#arrg)"/><line x1="250" x2="300" y1="284" y2="252" stroke="#2F8F5B" stroke-width="1.4" marker-end="url(#arrg)"/><line x1="250" x2="300" y1="342" y2="298" stroke="#2F8F5B" stroke-width="1.4" marker-end="url(#arrg)"/><rect width="236" height="170" x="14" y="388" fill="#FFF" stroke="#D9521B" stroke-width="1.75" rx="3"/><text x="30" y="414" fill="#151A21" font-size="13" font-weight="600">The other ten ports</text><text x="30" y="434" fill="#5B6470" font-size="11.5">listen on every interface too:</text><text x="30" y="456" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">3003 · 3010 · 5007 · 5008</text><text x="30" y="474" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">5009 · 5010 · 5016–5018 · 5109</text><text x="30" y="500" fill="#5B6470" font-size="11.5">Block them at the host firewall.</text><text x="30" y="518" fill="#5B6470" font-size="11.5">5008 creates and kills sandboxes;</text><text x="30" y="536" fill="#5B6470" font-size="11.5">nothing authenticates it.</text><rect width="236" height="112" x="14" y="582" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="30" y="608" fill="#151A21" font-size="13" font-weight="600">Reading the picture</text><line x1="30" x2="56" y1="628" y2="628" stroke="#2F8F5B" stroke-width="1.4" marker-end="url(#arrg)"/><text x="66" y="632" fill="#5B6470" font-size="10.5">what an SDK client reaches</text><line x1="30" x2="56" y1="652" y2="652" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="66" y="656" fill="#5B6470" font-size="10.5">flows inside the machine</text><rect width="26" height="14" x="30" y="668" fill="#FFF" stroke="#2F6FBF" stroke-width="1.5" rx="2"/><text x="66" y="680" fill="#5B6470" font-size="10.5">a Firecracker microVM</text><rect width="916" height="674" x="270" y="96" fill="#FFF" stroke="#D9521B" stroke-width="1.75" rx="4"/><text x="300" y="126" fill="#151A21" font-size="16" font-weight="600">The machine</text><text x="300" y="146" fill="#5B6470" font-size="12">one Linux x86-64 or arm64 host with /dev/kvm — its firewall is the only boundary</text><text x="300" y="178" fill="#5B6470" font-size="10.5" font-weight="600" letter-spacing=".1em">HOST NETWORK</text><text x="1156" y="178" fill="#5B6470" font-size="11" text-anchor="end">every port here listens on every interface of the machine</text><rect width="260" height="40" x="300" y="186" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="316" y="203" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">api</text><text x="316" y="219" fill="#5B6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">:3000 REST · :5009 · :5109 gRPC</text><rect width="260" height="40" x="300" y="232" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="316" y="249" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">client-proxy</text><text x="316" y="265" fill="#5B6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">:3002 sandboxes · :3003 health</text><rect width="260" height="40" x="300" y="278" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="316" y="295" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">dashboard</text><text x="316" y="311" fill="#5B6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">:3001 browser · :3010 dashboard-api</text><rect width="516" height="122" x="640" y="190" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="660" y="220" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">orchestrator</text><text x="660" y="240" fill="#5B6470" font-size="11.5">a host process, launched through nsenter by a privileged container</text><text x="660" y="266" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">:5007 sandbox proxy · :5008 gRPC control (unauthenticated)</text><text x="660" y="288" fill="#5B6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">egress proxies :5010 · :5016–5018</text><line x1="560" x2="640" y1="206" y2="206" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="566" y="198" fill="#5B6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">gRPC :5008</text><path fill="none" stroke="#5B6470" stroke-width="1.1" d="M560,214 H568 V514"/><text x="576" y="300" fill="#5B6470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">api</text><text x="300" y="346" fill="#5B6470" font-size="10.5" font-weight="600" letter-spacing=".1em">SANDBOXES</text><path fill="none" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)" d="M560,252 H620 V358"/><text x="628" y="334" fill="#5B6470" font-size="10">proxied traffic</text><line x1="950" x2="950" y1="312" y2="358" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="958" y="334" fill="#5B6470" font-size="10">creates and destroys</text><rect width="196" height="88" x="340" y="358" fill="#FFF" stroke="#2F6FBF" stroke-width="1.5" rx="3"/><text x="356" y="380" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Firecracker microVM</text><rect width="62" height="24" x="356" y="392" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="367" y="408" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">envd</text><text x="426" y="408" fill="#5B6470" font-size="10">the agent inside</text><text x="356" y="432" fill="#5B6470" font-size="10">from the base template</text><rect width="196" height="88" x="596" y="358" fill="#FFF" stroke="#2F6FBF" stroke-width="1.5" rx="3"/><text x="612" y="380" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Firecracker microVM</text><rect width="62" height="24" x="612" y="392" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="623" y="408" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">envd</text><text x="682" y="408" fill="#5B6470" font-size="10">the agent inside</text><text x="612" y="432" fill="#5B6470" font-size="10">one per Sandbox.create</text><rect width="196" height="88" x="852" y="358" fill="#FFF" stroke="#2F6FBF" stroke-width="1.5" rx="3"/><text x="868" y="380" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Firecracker microVM</text><rect width="62" height="24" x="868" y="392" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="879" y="408" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">envd</text><text x="938" y="408" fill="#5B6470" font-size="10">the agent inside</text><text x="868" y="432" fill="#5B6470" font-size="10">or from a template you built</text><text x="1048" y="468" fill="#5B6470" font-size="11" text-anchor="end">templates and caches under /var/lib/e2b</text><line x1="1100" x2="1100" y1="312" y2="540" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="1108" y="464" fill="#5B6470" font-size="10">sandbox and</text><text x="1108" y="478" fill="#5B6470" font-size="10">build logs</text><text x="300" y="496" fill="#5B6470" font-size="10.5" font-weight="600" letter-spacing=".1em">LOOPBACK ONLY · 127.0.0.1</text><text x="1048" y="496" fill="#5B6470" font-size="11" text-anchor="end">nothing outside the machine reaches these</text><line x1="402" x2="1053" y1="514" y2="514" stroke="#5B6470" stroke-width="1.1"/><line x1="402" x2="402" y1="514" y2="540" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="410" y="532" fill="#5B6470" font-size="9.5">state</text><line x1="619" x2="619" y1="514" y2="540" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="627" y="532" fill="#5B6470" font-size="9.5">cache</text><line x1="836" x2="836" y1="540" y2="514" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="844" y="532" fill="#5B6470" font-size="9.5">reads sandbox_logs</text><line x1="1053" x2="1053" y1="514" y2="540" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><text x="1045" y="532" fill="#5B6470" font-size="9.5" text-anchor="end">its own logs</text><rect width="205" height="74" x="300" y="540" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="316" y="564" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Postgres</text><text x="316" y="584" fill="#5B6470" data-scope="loopback" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">:5432</text><text x="316" y="602" fill="#5B6470" font-size="10.5">teams, sandboxes, templates</text><rect width="205" height="74" x="517" y="540" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="533" y="564" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Redis</text><text x="533" y="584" fill="#5B6470" data-scope="loopback" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">:6379</text><text x="533" y="602" fill="#5B6470" font-size="10.5">cache and team-key lookups</text><rect width="205" height="74" x="734" y="540" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="750" y="564" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">ClickHouse</text><text x="750" y="584" fill="#5B6470" data-scope="loopback" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">:8123 · :9000</text><text x="750" y="602" fill="#5B6470" font-size="10.5">sandbox_logs · seven days</text><rect width="205" height="74" x="951" y="540" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="967" y="564" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Vector</text><text x="967" y="584" fill="#5B6470" data-scope="loopback" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">:30006</text><text x="967" y="602" fill="#5B6470" data-scope="loopback" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">:20006 · :44313 on Kubernetes</text><path fill="none" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)" d="M1053,614 V644 H880 V614"/><text x="890" y="636" fill="#5B6470" font-size="10">sandbox_logs rows</text><text x="300" y="672" fill="#5B6470" font-size="10.5" font-weight="600" letter-spacing=".1em">FIRST BOOT</text><rect width="94" height="44" x="300" y="684" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="347" y="711" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">preflight</text><line x1="394" x2="422" y1="706" y2="706" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><rect width="94" height="44" x="422" y="684" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="469" y="711" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">host-setup</text><line x1="516" x2="544" y1="706" y2="706" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><rect width="94" height="44" x="544" y="684" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="591" y="711" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">fetch-artifacts</text><line x1="638" x2="666" y1="706" y2="706" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><rect width="126" height="44" x="666" y="684" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="729" y="702" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">db-migrator</text><text x="729" y="718" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">clickhouse-migrator</text><line x1="792" x2="820" y1="706" y2="706" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><rect width="94" height="44" x="820" y="684" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="867" y="702" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">seed</text><text x="867" y="718" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">api-secrets</text><line x1="914" x2="942" y1="706" y2="706" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><rect width="94" height="44" x="942" y="684" fill="#FFF" stroke="#E3E6EB" stroke-width="1" rx="3"/><text x="989" y="711" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">base-template</text><line x1="1036" x2="1062" y1="706" y2="706" stroke="#5B6470" stroke-width="1.1" marker-end="url(#arr)"/><rect width="94" height="44" x="1062" y="684" fill="#FFF" stroke="#D9521B" stroke-width="1.75" rx="3"/><text x="1109" y="711" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="middle">ready</text><text x="300" y="752" fill="#5B6470" font-size="12">one-shots run once along their gates (api-secrets waits only on preflight); ready prints the SDK variables and the dashboard URL</text><text x="16" y="798" fill="#5B6470" font-size="10.5" font-weight="600" letter-spacing=".1em">THREE WAYS TO GET THIS MACHINE</text><rect width="380" height="94" x="14" y="808" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="30" y="834" fill="#151A21" font-size="14.5" font-weight="600">Docker Compose</text><rect width="218" height="26" x="30" y="844" fill="#FDF1EA" stroke="#D9521B" stroke-width="1" rx="3"/><text x="40" y="862" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">docker compose up -d --wait</text><text x="30" y="888" fill="#5B6470" font-size="11.5">you prepare the Linux host, then run this on it</text><rect width="380" height="94" x="410" y="808" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="426" y="834" fill="#151A21" font-size="14.5" font-weight="600">Terraform on GCP</text><rect width="132" height="26" x="426" y="844" fill="#FDF1EA" stroke="#D9521B" stroke-width="1" rx="3"/><text x="436" y="862" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">terraform apply</text><text x="426" y="888" fill="#5B6470" font-size="11.5">one GCE instance; its template prepares the machine</text><rect width="380" height="94" x="806" y="808" fill="#FFF" stroke="#C9CED6" stroke-width="1" rx="3"/><text x="822" y="834" fill="#151A21" font-size="14.5" font-weight="600">Kubernetes</text><rect width="262" height="26" x="822" y="844" fill="#FDF1EA" stroke="#D9521B" stroke-width="1" rx="3"/><text x="832" y="862" fill="#151A21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">kubectl apply -k embed/kubernetes</text><text x="822" y="888" fill="#5B6470" font-size="11.5">one KVM node; the pod&apos;s init containers prepare it</text></svg>